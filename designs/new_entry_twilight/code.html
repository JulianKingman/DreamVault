<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>New Entry | Twilight</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;family=Epilogue:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#7e2b17",
                        "tertiary-container": "#f8a010",
                        "on-primary-fixed": "#633300",
                        "on-secondary-fixed-variant": "#4e5c71",
                        "on-secondary-fixed": "#324053",
                        "surface-container-highest": "#00264e",
                        "on-error-container": "#ff9b82",
                        "on-surface-variant": "#89ace7",
                        "primary-fixed-dim": "#ffcaa1",
                        "outline-variant": "#21487d",
                        "primary": "#ffb77d",
                        "error": "#ed7f64",
                        "secondary-container": "#2e3c4f",
                        "on-tertiary-fixed-variant": "#563400",
                        "on-background": "#dae6ff",
                        "on-primary-fixed-variant": "#8c4a00",
                        "on-tertiary-container": "#4a2c00",
                        "surface-container-low": "#02132c",
                        "background": "#040e1f",
                        "secondary-fixed-dim": "#c7d5ed",
                        "secondary": "#909fb5",
                        "primary-dim": "#ffa454",
                        "inverse-primary": "#914d00",
                        "on-secondary": "#122133",
                        "surface-tint": "#ffb77d",
                        "surface": "#040e1f",
                        "surface-dim": "#040e1f",
                        "inverse-on-surface": "#4a5569",
                        "on-surface": "#dae6ff",
                        "tertiary-fixed": "#f8a010",
                        "on-primary": "#643400",
                        "tertiary": "#ffb148",
                        "on-tertiary-fixed": "#2a1700",
                        "inverse-surface": "#f9f9ff",
                        "primary-container": "#6e3900",
                        "surface-variant": "#00264e",
                        "surface-container": "#001938",
                        "surface-bright": "#002c5a",
                        "outline": "#5376ae",
                        "primary-fixed": "#ffdcc3",
                        "surface-container-lowest": "#000000",
                        "tertiary-dim": "#e79400",
                        "secondary-fixed": "#d5e3fc",
                        "secondary-dim": "#909fb5",
                        "on-tertiary": "#573500",
                        "tertiary-fixed-dim": "#e79400",
                        "error-dim": "#ba573f",
                        "on-secondary-container": "#b2c0d8",
                        "on-primary-container": "#ffc497",
                        "on-error": "#450900",
                        "surface-container-high": "#001f43"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background: radial-gradient(circle at top right, #001f43, #040e1f 70%);
            min-height: 100vh;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(0, 25, 56, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body text-on-background selection:bg-primary-container selection:text-on-primary-container">
<main class="max-w-4xl mx-auto px-6 pt-24 pb-40">
<!-- Writing Area -->
<section class="space-y-12">
<div class="relative group">
<input class="w-full bg-transparent border-none focus:ring-0 text-5xl md:text-6xl font-headline italic placeholder:text-surface-container-highest transition-all duration-500 outline-none" placeholder="Title your thoughts..." type="text"/>
</div>
<div class="relative">
<textarea class="w-full bg-transparent border-none focus:ring-0 text-xl leading-relaxed font-body placeholder:text-surface-container-highest resize-none outline-none" placeholder="Start writing under the twilight..." rows="12"></textarea>
</div>
</section>
<!-- Interpretation Notes Section -->
<section class="mt-16 space-y-6 pt-16">
<div class="flex items-center gap-4 text-on-surface-variant">
<span class="material-symbols-outlined text-sm">auto_awesome</span>
<h2 class="text-xs font-bold uppercase tracking-widest font-label">Interpretation Notes</h2>
</div>
<div class="surface-container-low rounded-xl p-8 glass-panel border border-outline-variant/15">
<textarea class="w-full bg-transparent border-none focus:ring-0 text-md leading-relaxed font-body placeholder:text-secondary-fixed-dim/30 resize-none outline-none italic" placeholder="Record the deeper resonance..."></textarea>
</div>
</section>
</main>
<!-- Floating Accessory Bar -->
<div class="fixed bottom-12 left-1/2 -translate-x-1/2 w-[95%] max-w-2xl z-50">
<div class="glass-panel rounded-full border border-outline-variant/20 shadow-2xl px-4 py-3 flex items-center justify-between">
<div class="flex items-center gap-1 md:gap-2">
<!-- Clarity -->
<button class="flex items-center justify-center w-12 h-12 rounded-full text-secondary hover:bg-surface-bright/40 hover:text-primary transition-all group" title="Clarity">
<span class="material-symbols-outlined text-[22px]">auto_awesome</span>
</button>
<!-- Tags (Triggers modal concept) -->
<button class="flex items-center justify-center w-12 h-12 rounded-full text-secondary hover:bg-surface-bright/40 hover:text-primary transition-all" title="Vibes">
<span class="material-symbols-outlined text-[22px]">sell</span>
</button>
<!-- Favorite -->
<button class="flex items-center justify-center w-12 h-12 rounded-full text-secondary hover:bg-surface-bright/40 hover:text-primary transition-all" title="Favorite">
<span class="material-symbols-outlined text-[22px]">star</span>
</button>
</div>
<!-- Tags Visualization (Simulated small pills in bar) -->
<div class="hidden md:flex gap-2 mx-4 overflow-hidden mask-fade-right">
<span class="px-3 py-1 bg-secondary-container/40 rounded-full text-[10px] font-bold text-secondary uppercase tracking-tighter backdrop-blur-md">Melancholy</span>
<span class="px-3 py-1 bg-secondary-container/40 rounded-full text-[10px] font-bold text-secondary uppercase tracking-tighter backdrop-blur-md">Growth</span>
</div>
<div class="flex items-center gap-4">
<!-- Complete Button -->
<button class="bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold px-8 py-3 rounded-full text-sm shadow-lg shadow-primary-container/20 hover:brightness-110 active:scale-95 transition-all">
                    Complete
                </button>
</div>
</div>
</div>
<!-- Vibes Modal (Simplified for UI representation as requested) -->
<!-- This would normally be toggled, but is rendered here as an open state demonstration of the style -->
<div class="fixed inset-0 z-[60] bg-background/80 backdrop-blur-md flex items-center justify-center pointer-events-none opacity-0">
<!-- Placeholder for the Modal Interaction -->
<div class="w-full max-w-lg glass-panel rounded-xl p-8 border border-outline-variant/30 transform scale-95 shadow-glow">
<h3 class="font-headline text-3xl mb-6">Select Vibes</h3>
<div class="flex flex-wrap gap-3">
<!-- Ethereal Chips -->
<button class="px-5 py-2 rounded-full bg-secondary-container text-on-secondary-container text-sm font-medium border border-outline-variant/20">Quietude</button>
<button class="px-5 py-2 rounded-full bg-primary-container text-on-primary-container text-sm font-medium border border-primary/30">Ephemeral</button>
<button class="px-5 py-2 rounded-full bg-secondary-container text-on-secondary-container text-sm font-medium border border-outline-variant/20">Resonance</button>
<button class="px-5 py-2 rounded-full bg-secondary-container text-on-secondary-container text-sm font-medium border border-outline-variant/20">Liminal</button>
<button class="px-5 py-2 rounded-full bg-secondary-container text-on-secondary-container text-sm font-medium border border-outline-variant/20">Nocturnal</button>
</div>
</div>
</div>
<!-- Hidden Navigation Shell (Suppressed as per rules for task-focused entry screen) -->
<!-- BottomNavBar would be here but suppressed for focused writing journey -->
<!-- Background Decoration -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none overflow-hidden">
<div class="absolute top-[10%] right-[-5%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[50%] h-[50%] rounded-full bg-surface-container-highest/30 blur-[150px]"></div>
</div>
</body></html>
